[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "Q", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Heavy image libraries are imported lazily inside the functions that need them
# so a Pano run never pays for numpy/scipy and a Fuse run never pays for Pillow.
"hugintools/fuse.py" = ["PLC0415"]
"hugintools/pano.py" = ["PLC0415"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
